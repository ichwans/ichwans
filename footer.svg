<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="100%" height="160">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>
    <linearGradient id="neonLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.1"/>
      <stop offset="30%" stop-color="#00f0ff"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0.1"/>
    </linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.3"/>
    </pattern>
  </defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap');
    .footer-heading { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 20px; font-weight: 700; fill: #ffffff; }
    .footer-sub { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 13px; font-weight: 400; fill: #94a3b8; }
    .badge-txt { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; fill: #00f0ff; letter-spacing: 0.5px; }
  </style>
  <rect width="1200" height="160" rx="16" fill="url(#footerBg)"/>
  <rect width="1200" height="160" rx="16" fill="url(#dots)"/>
  <rect x="0" y="0" width="1200" height="2" fill="url(#neonLine)"/>
  <g transform="translate(60, 35)">
    <rect x="0" y="0" width="175" height="24" rx="12" fill="#1e293b" stroke="#00f0ff" stroke-width="0.75" stroke-opacity="0.6"/>
    <text x="14" y="16" class="badge-txt">• COLLABORATION READY</text>
    <text x="0" y="55" class="footer-heading">Let's Build Scalable Infrastructure &amp; Next-Gen Decentralized Systems</text>
    <text x="0" y="80" class="footer-sub">Open for Senior DevOps / Infrastructure Lead roles, IT System Architecture consulting, and Blockchain R&amp;D partnerships.</text>
  </g>
  <g transform="translate(1020, 45)" opacity="0.7">
    <circle cx="40" cy="35" r="28" fill="#1e293b" stroke="#334155"/>
    <circle cx="40" cy="35" r="6" fill="#00f0ff"/>
    <circle cx="100" cy="20" r="14" fill="#0f172a" stroke="#38bdf8"/>
    <circle cx="100" cy="20" r="3" fill="#38bdf8"/>
    <line x1="68" y1="31" x2="86" y2="24" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="3 3"/>
  </g>
</svg>
