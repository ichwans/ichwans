<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="45%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>
    <pattern id="infraGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.4"/>
      <circle cx="0" cy="0" r="1.5" fill="#00f0ff" fill-opacity="0.25"/>
    </pattern>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap');
    .title { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; letter-spacing: -0.5px; }
    .subtitle { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 600; fill: #00f0ff; letter-spacing: 1px; }
    .body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 14px; fill: #94a3b8; font-weight: 400; line-height: 1.5; }
    .pill-text { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500; fill: #e2e8f0; }
    .stat-val { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 700; font-size: 22px; fill: #ffffff; }
    .stat-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #64748b; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
  </style>
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" rx="16" fill="url(#infraGrid)"/>
  <rect x="0" y="0" width="6" height="360" rx="3" fill="url(#cyanBlueGrad)"/>
  <g opacity="0.85" transform="translate(860, 40)">
    <path d="M 40 80 L 120 40 L 200 80 L 200 180 L 120 220 L 40 180 Z" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
    <path d="M 60 90 L 120 60 L 180 90 L 180 170 L 120 200 L 60 170 Z" fill="#0f172a" fill-opacity="0.6" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.6"/>
    <line x1="120" y1="60" x2="120" y2="130" stroke="#38bdf8" stroke-width="2"/>
    <line x1="60" y1="90" x2="120" y2="130" stroke="#38bdf8" stroke-width="2"/>
    <line x1="180" y1="90" x2="120" y2="130" stroke="#38bdf8" stroke-width="2"/>
    <line x1="60" y1="170" x2="120" y2="130" stroke="#00f0ff" stroke-width="1.5"/>
    <line x1="180" y1="170" x2="120" y2="130" stroke="#00f0ff" stroke-width="1.5"/>
    <line x1="120" y1="200" x2="120" y2="130" stroke="#00f0ff" stroke-width="1.5"/>
    <circle cx="120" cy="130" r="16" fill="#0284c7" filter="url(#glowFilter)"/>
    <circle cx="120" cy="130" r="8" fill="#ffffff"/>
    <circle cx="120" cy="60" r="7" fill="#00f0ff"/>
    <circle cx="60" cy="90" r="7" fill="#38bdf8"/>
    <circle cx="180" cy="90" r="7" fill="#38bdf8"/>
    <circle cx="60" cy="170" r="7" fill="#6366f1"/>
    <circle cx="180" cy="170" r="7" fill="#6366f1"/>
    <circle cx="120" cy="200" r="7" fill="#00f0ff"/>
    <circle cx="120" cy="130" r="95" fill="none" stroke="#00f0ff" stroke-width="1" stroke-dasharray="6 6" stroke-opacity="0.3"/>
    <circle cx="215" cy="130" r="4" fill="#00f0ff"/>
    <circle cx="25" cy="130" r="3" fill="#38bdf8"/>
  </g>
  <g transform="translate(60, 50)">
    <g transform="translate(0, 0)">
      <rect width="395" height="32" rx="16" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="16" r="4.5" fill="#10b981"/>
      <text x="30" y="21" class="pill-text" fill="#38bdf8">ENTERPRISE IT INFRASTRUCTURE &amp; DEV</text>
    </g>
    <text x="0" y="80" class="title">Ichwan Subekti</text>
    <text x="0" y="112" class="subtitle">SYSADMIN • CLOUD &amp; NETWORKS • BLOCKCHAIN RESEARCHER</text>
    <text x="0" y="145" class="body">Architecting resilient 99.9% SLA enterprise infrastructure, campus-scale ERP/SIAKAD systems,</text>
    <text x="0" y="168" class="body">and engineering next-generation decentralized asset management platforms &amp; AI-driven tooling.</text>
    <g transform="translate(0, 205)">
      <g transform="translate(0, 0)">
        <rect width="160" height="60" rx="8" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1"/>
        <text x="16" y="28" class="stat-val" fill="#00f0ff">12+ Years</text>
        <text x="16" y="47" class="stat-label">Enterprise Infra</text>
      </g>
      <g transform="translate(175, 0)">
        <rect width="160" height="60" rx="8" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1"/>
        <text x="16" y="28" class="stat-val" fill="#10b981">99.9%</text>
        <text x="16" y="47" class="stat-label">SLA Uptime Target</text>
      </g>
      <g transform="translate(350, 0)">
        <rect width="180" height="60" rx="8" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1"/>
        <text x="16" y="28" class="stat-val" fill="#38bdf8">M.Sc. Candidate</text>
        <text x="16" y="47" class="stat-label">Computer Science IPB</text>
      </g>
      <g transform="translate(545, 0)">
        <rect width="165" height="60" rx="8" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1"/>
        <text x="16" y="28" class="stat-val" fill="#a855f7">Web3 &amp; MCP</text>
        <text x="16" y="47" class="stat-label">Automation &amp; R&amp;D</text>
      </g>
    </g>
  </g>
</svg>
